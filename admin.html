
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Gallegos Fariña Propiedades</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: Arial, sans-serif;
      color: #24302b; background: #f4f6f4;
    }
    main { max-width: 850px; margin: 0 auto; }
    section {
      background: white; padding: 24px; margin: 18px 0;
      border-radius: 12px; box-shadow: 0 2px 12px #0000000d;
    }
    h1 { font-size: 27px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select, textarea, button {
      width: 100%; padding: 12px; font: inherit;
      border: 1px solid #ccd3ce; border-radius: 7px;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      margin-top: 16px; cursor: pointer;
      color: white; background: #286747; border: 0;
    }
    button.secondary { background: #56635b; }
    button:disabled { opacity: .6; cursor: wait; }
    .hidden { display: none; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .property { padding: 12px 0; border-bottom: 1px solid #ddd; }
    .muted { color: #606b64; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Gallegos Fariña Propiedades</h1>
  <p>Panel privado de administración</p>

  <section id="loginSection">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required
             autocomplete="username"
             value="propmariajosegallegos@gmail.com">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required
             autocomplete="current-password">

      <button id="loginButton" type="submit">Iniciar sesión</button>
    </form>
  </section>

  <section id="adminSection" class="hidden">
    <p id="signedIn"></p>
    <button id="logoutButton" class="secondary">Cerrar sesión</button>

    <h2>Registrar propiedad</h2>
    <form id="propertyForm">
      <label for="title">Título</label>
      <input id="title" required maxlength="180">

      <label for="operation">Operación</label>
      <select id="operation" required>
        <option value="Venta">Venta</option>
        <option value="Arriendo">Arriendo</option>
      </select>

      <label for="type">Tipo de propiedad</label>
      <select id="type" required>
        <option value="Casa">Casa</option>
        <option value="Departamento">Departamento</option>
        <option value="Terreno">Terreno</option>
        <option value="Parcela">Parcela</option>
        <option value="Local comercial">Local comercial</option>
        <option value="Oficina">Oficina</option>
        <option value="Otro">Otro</option>
      </select>

      <label for="location">Comuna o ubicación</label>
      <input id="location" required maxlength="180">

      <label for="price">Precio</label>
      <input id="price" required maxlength="100"
             placeholder="Ej.: $85.000.000">

      <label for="details">Características</label>
      <textarea id="details"
                placeholder="Dormitorios, baños, superficie, etc."></textarea>

      <label for="description">Descripción</label>
      <textarea id="description"></textarea>

      <label for="photos">Fotografías (máximo 5 MB por imagen)</label>
      <input id="photos" type="file"
             accept="image/jpeg,image/png,image/webp" multiple>

      <label>
        <input id="published" type="checkbox"
               style="width:auto; margin-right:8px">
        Publicar propiedad
      </label>

      <button id="saveButton" type="submit">Guardar propiedad</button>
    </form>

    <h2>Propiedades registradas</h2>
    <div id="propertiesList">Cargando propiedades…</div>
  </section>

  <section>
    <p id="message" role="status">Conectando con el servicio…</p>
    <p class="muted">
      El acceso y las operaciones dependen de las políticas de seguridad
      configuradas en Supabase.
    </p>
  </section>
</main>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://tplzdfbovaghgfvmdreb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3WAYTYJXOjEy3Vsstbt24g_WftvW5em';
const BUCKET = 'propiedades-fotos';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function message(text) {
  $('message').textContent = text;
}

function showAdmin(user) {
  $('loginSection').classList.add('hidden');
  $('adminSection').classList.remove('hidden');
  $('signedIn').textContent = 'Sesión iniciada: ' + user.email;
}

function showLogin() {
  $('loginSection').classList.remove('hidden');
  $('adminSection').classList.add('hidden');
}

async function requireAdmin() {
  const { data, error } = await supabase.auth.getUser();
  if (error || !data.user) {
    showLogin();
    return null;
  }

  // El rol debe estar en app_metadata, gestionado desde el servidor.
  if (data.user.app_metadata?.role !== 'admin') {
    showLogin();
    message('La cuenta inició sesión, pero no tiene rol de administradora.');
    return null;
  }

  showAdmin(data.user);
  return data.user;
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('loginButton').disabled = true;
  message('Iniciando sesión…');

  try {
    const { error } = await supabase.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });

    if (error) throw error;

    const user = await requireAdmin();
    if (user) {
      message('Sesión iniciada correctamente.');
      await loadProperties();
    }
  } catch (error) {
    message('No se pudo iniciar sesión: ' + error.message);
  } finally {
    $('loginButton').disabled = false;
  }
});

$('logoutButton').addEventListener('click', async () => {
  await supabase.auth.signOut();
  showLogin();
  message('Sesión cerrada.');
});

async function loadProperties() {
  const { data, error } = await supabase
    .from('propiedades')
    .select('id,titulo,operacion,tipo,comuna,precio,publicada,created_at')
    .order('created_at', { ascending: false });

  if (error) {
    message('No se pudieron cargar las propiedades: ' + error.message);
    return;
  }

  const list = $('propertiesList');
  list.replaceChildren();

  if (!data.length) {
    list.textContent = 'Todavía no hay propiedades registradas.';
    return;
  }

  for (const property of data) {
    const item = document.createElement('div');
    item.className = 'property';

    const title = document.createElement('strong');
    title.textContent = property.titulo || 'Sin título';

    const info = document.createElement('p');
    info.textContent =
      `${property.operacion || ''} · ${property.tipo || ''} · ` +
      `${property.comuna || ''} · ${property.precio || ''}`;

    const status = document.createElement('p');
    status.textContent = property.publicada ? 'Publicada' : 'Borrador';

    item.append(title, info, status);
    list.append(item);
  }
}

$('propertyForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('saveButton').disabled = true;

  const user = await requireAdmin();
  if (!user) {
    message('Debes iniciar sesión con una cuenta administradora.');
    $('saveButton').disabled = false;
    return;
  }

  const uploadedPaths = [];

  try {
    const files = Array.from($('photos').files);

    if (files.length > 20) {
      throw new Error('Puedes subir un máximo de 20 fotografías por propiedad.');
    }

    for (const file of files) {
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        throw new Error('Usa únicamente imágenes JPEG, PNG o WebP.');
      }
      if (file.size > 5 * 1024 * 1024) {
        throw new Error(`La imagen "${file.name}" supera los 5 MB.`);
      }
    }

    message('Subiendo fotografías…');

    for (const file of files) {
      const safeName = file.name
        .normalize('NFKD')
        .replace(/[^a-zA-Z0-9._-]/g, '_');

      const path = `${user.id}/${crypto.randomUUID()}-${safeName}`;

      const { error } = await supabase.storage
        .from(BUCKET)
        .upload(path, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type
        });

      if (error) throw error;
      uploadedPaths.push(path);
    }

    const record = {
      titulo: $('title').value.trim(),
      operacion: $('operation').value,
      tipo: $('type').value,
      comuna: $('location').value.trim(),
      precio: $('price').value.trim(),
      caracteristicas: $('details').value.trim(),
      descripcion: $('description').value.trim(),
      fotografias: uploadedPaths,
      publicada: $('published').checked
    };

    message('Guardando propiedad…');

    const { error } = await supabase
      .from('propiedades')
      .insert(record);

    if (error) throw error;

    $('propertyForm').reset();
    message('Propiedad guardada correctamente.');
    await loadProperties();

  } catch (error) {
    message(
      'No se pudo completar la operación: ' + error.message +
      (uploadedPaths.length
        ? '\nPuede que algunas fotografías ya se hayan subido; revisa Storage antes de repetir.'
        : '')
    );
  } finally {
    $('saveButton').disabled = false;
  }
});

supabase.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_OUT' || !session) {
    showLogin();
  }
});

const user = await requireAdmin();
if (user) {
  message('Sesión activa. Comprobando propiedades…');
  await loadProperties();
} else {
  message('Introduce tus credenciales para acceder al panel.');
}
</script>
</body>
</html>
