
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Gallegos Fariña Propiedades</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #24302b;
      background: #f4f6f4;
    }
    main { max-width: 900px; margin: 0 auto; }
    section {
      background: white;
      padding: 24px;
      margin: 18px 0;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0000000d;
    }
    h1 { font-size: 27px; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      font: inherit;
      border: 1px solid #ccd3ce;
      border-radius: 7px;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      margin-top: 10px;
      cursor: pointer;
      color: white;
      background: #286747;
      border: 0;
    }
    button.secondary { background: #56635b; }
    button.warning { background: #9a6814; }
    button.danger { background: #a52e2e; }
    button:disabled { opacity: .6; cursor: wait; }
    .hidden { display: none !important; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .property {
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
    }
    .property:last-child { border-bottom: 0; }
    .muted { color: #606b64; font-size: 14px; }
    .status { font-weight: bold; }
    .status.published { color: #286747; }
    .status.draft { color: #8a5b10; }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .actions button { margin-top: 4px; }
    .form-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    #cancelEditButton { width: auto; padding: 9px 14px; }
    @media (max-width: 560px) {
      body { padding: 12px; }
      section { padding: 16px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>Gallegos Fariña Propiedades</h1>
  <p>Panel privado de administración</p>

  <section id="loginSection">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required
        autocomplete="username"
        value="propmariajosegallegos@gmail.com">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required
        autocomplete="current-password">

      <button id="loginButton" type="submit">Iniciar sesión</button>
    </form>
  </section>

  <section id="adminSection" class="hidden">
    <p id="signedIn"></p>
    <button id="logoutButton" class="secondary" type="button">
      Cerrar sesión
    </button>

    <div class="form-heading">
      <h2 id="formHeading">Registrar propiedad</h2>
      <button id="cancelEditButton" class="secondary hidden"
        type="button">Cancelar edición</button>
    </div>

    <form id="propertyForm">
      <label for="title">Título</label>
      <input id="title" required maxlength="180">

      <label for="operation">Operación</label>
      <select id="operation" required>
        <option value="Venta">Venta</option>
        <option value="Arriendo">Arriendo</option>
      </select>

      <label for="type">Tipo de propiedad</label>
      <select id="type" required>
        <option value="Casa">Casa</option>
        <option value="Departamento">Departamento</option>
        <option value="Terreno">Terreno</option>
        <option value="Parcela">Parcela</option>
        <option value="Local comercial">Local comercial</option>
        <option value="Oficina">Oficina</option>
        <option value="Otro">Otro</option>
      </select>

      <label for="location">Comuna o ubicación</label>
      <input id="location" required maxlength="180">

      <label for="price">Precio</label>
      <input id="price" required maxlength="100"
        placeholder="Ej.: $85.000.000">

      <label for="details">Características</label>
      <textarea id="details"
        placeholder="Dormitorios, baños, superficie, etc."></textarea>

      <label for="description">Descripción</label>
      <textarea id="description"></textarea>

      <label for="photos">Fotografías (máximo 5 MB por imagen)</label>
      <input id="photos" type="file"
        accept="image/jpeg,image/png,image/webp" multiple>

      <p id="existingPhotos" class="muted hidden"></p>

      <label>
        <input id="published" type="checkbox"
          style="width:auto; margin-right:8px">
        Publicar propiedad
      </label>

      <button id="saveButton" type="submit">Guardar propiedad</button>
    </form>

    <h2>Propiedades registradas</h2>
    <div id="propertiesList">Cargando propiedades…</div>
  </section>

  <section>
    <p id="message" role="status">Conectando con el servicio…</p>
    <p class="muted">
      Las operaciones de administración dependen de los permisos
      configurados en Supabase.
    </p>
  </section>
</main>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
  'https://tplzdfbovaghgfvmdreb.supabase.co';
const SUPABASE_KEY =
  'sb_publishable_3WAYTYJXOjEy3Vsstbt24g_WftvW5em';
const BUCKET = 'propiedades-fotos';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let editingId = null;
let editingPhotos = [];
let busy = false;

function message(text) {
  $('message').textContent = text;
}

function showAdmin(user) {
  $('loginSection').classList.add('hidden');
  $('adminSection').classList.remove('hidden');
  $('signedIn').textContent = 'Sesión iniciada: ' + user.email;
}

function showLogin() {
  $('loginSection').classList.remove('hidden');
  $('adminSection').classList.add('hidden');
}

async function requireAdmin() {
  const { data, error } = await supabase.auth.getUser();

  if (error || !data.user) {
    showLogin();
    return null;
  }

  if (data.user.app_metadata?.role !== 'admin') {
    showLogin();
    message(
      'La cuenta inició sesión, pero no tiene rol de administradora.'
    );
    return null;
  }

  showAdmin(data.user);
  return data.user;
}

function resetEditor() {
  editingId = null;
  editingPhotos = [];
  $('propertyForm').reset();
  $('formHeading').textContent = 'Registrar propiedad';
  $('saveButton').textContent = 'Guardar propiedad';
  $('cancelEditButton').classList.add('hidden');
  $('existingPhotos').textContent = '';
  $('existingPhotos').classList.add('hidden');
  $('photos').value = '';
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('loginButton').disabled = true;
  message('Iniciando sesión…');

  try {
    const { error } = await supabase.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });

    if (error) throw error;

    const user = await requireAdmin();

    if (user) {
      message('Sesión iniciada correctamente.');
      await loadProperties();
    }
  } catch (error) {
    message('No se pudo iniciar sesión: ' + error.message);
  } finally {
    $('loginButton').disabled = false;
  }
});

$('logoutButton').addEventListener('click', async () => {
  await supabase.auth.signOut();
  resetEditor();
  showLogin();
  message('Sesión cerrada.');
});

$('cancelEditButton').addEventListener('click', () => {
  resetEditor();
  message('Edición cancelada.');
});

async function loadProperties() {
  const { data, error } = await supabase
    .from('propiedades')
    .select(
      'id,titulo,operacion,tipo,comuna,precio,caracteristicas,' +
      'descripcion,fotografias,publicada,created_at'
    )
    .order('created_at', { ascending: false });

  if (error) {
    message('No se pudieron cargar las propiedades: ' + error.message);
    return;
  }

  const list = $('propertiesList');
  list.replaceChildren();

  if (!data || data.length === 0) {
    list.textContent = 'Todavía no hay propiedades registradas.';
    return;
  }

  for (const property of data) {
    const item = document.createElement('div');
    item.className = 'property';

    const title = document.createElement('strong');
    title.textContent = property.titulo || 'Sin título';

    const info = document.createElement('p');
    info.textContent =
      `${property.operacion || ''} · ${property.tipo || ''} · ` +
      `${property.comuna || ''} · ${property.precio || ''}`;

    const status = document.createElement('p');
    status.className =
      'status ' + (property.publicada ? 'published' : 'draft');
    status.textContent = property.publicada
      ? 'Publicada en la web'
      : 'Borrador / retirada de publicación';

    const actions = document.createElement('div');
    actions.className = 'actions';

    const editButton = document.createElement('button');
    editButton.type = 'button';
    editButton.className = 'secondary';
    editButton.textContent = 'Editar';
    editButton.addEventListener('click', () => startEdit(property));

    const toggleButton = document.createElement('button');
    toggleButton.type = 'button';
    toggleButton.className = 'warning';
    toggleButton.textContent = property.publicada
      ? 'Retirar de publicación'
      : 'Publicar';
    toggleButton.addEventListener(
      'click', () => togglePublished(property)
    );

    const deleteButton = document.createElement('button');
    deleteButton.type = 'button';
    deleteButton.className = 'danger';
    deleteButton.textContent = 'Eliminar';
    deleteButton.addEventListener(
      'click', () => deleteProperty(property)
    );

    actions.append(editButton, toggleButton, deleteButton);
    item.append(title, info, status, actions);
    list.append(item);
  }
}

function startEdit(property) {
  editingId = property.id;
  editingPhotos = Array.isArray(property.fotografias)
    ? [...property.fotografias]
    : [];

  $('title').value = property.titulo || '';
  $('operation').value = property.operacion || 'Venta';
  $('type').value = property.tipo || 'Casa';
  $('location').value = property.comuna || '';
  $('price').value = property.precio || '';
  $('details').value = property.caracteristicas || '';
  $('description').value = property.descripcion || '';
  $('published').checked = Boolean(property.publicada);
  $('photos').value = '';

  $('formHeading').textContent = 'Editar propiedad';
  $('saveButton').textContent = 'Guardar cambios';
  $('cancelEditButton').classList.remove('hidden');

  $('existingPhotos').textContent =
    `Fotografías existentes: ${editingPhotos.length}. ` +
    'Si no añades nuevas, se conservarán.';
  $('existingPhotos').classList.remove('hidden');

  $('propertyForm').scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });

  message('Editando: ' + (property.titulo || 'propiedad sin título'));
}

async function togglePublished(property) {
  if (busy) return;

  const action = property.publicada
    ? 'retirar de publicación'
    : 'publicar';

  const confirmation = property.publicada
    ? `¿Retirar "${property.titulo}" de la web? ` +
      'La propiedad seguirá guardada en el panel.'
    : `¿Publicar "${property.titulo}" en la web?`;

  if (!window.confirm(confirmation)) return;

  busy = true;
  message(`Actualizando "${property.titulo}"…`);

  try {
    const user = await requireAdmin();
    if (!user) {
      throw new Error('Debes iniciar sesión como administradora.');
    }

    const { data, error } = await supabase
      .from('propiedades')
      .update({
        publicada: !property.publicada,
        updated_at: new Date().toISOString()
      })
      .eq('id', property.id)
      .select('id');

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error(
        'Supabase no modificó el registro. Comprueba los permisos ' +
        'UPDATE de la tabla propiedades.'
      );
    }

    message(
      `Propiedad ${property.publicada
        ? 'retirada de publicación'
        : 'publicada'} correctamente.`
    );
    await loadProperties();
  } catch (error) {
    message(`No se pudo ${action}: ${error.message}`);
  } finally {
    busy = false;
  }
}

async function deleteProperty(property) {
  if (busy) return;

  const confirmation =
    `¿Eliminar definitivamente "${property.titulo}"?\n\n` +
    'Esta acción no se puede deshacer. Para ocultarla de la web ' +
    'sin borrarla, usa “Retirar de publicación”.';

  if (!window.confirm(confirmation)) return;

  busy = true;
  message(`Eliminando "${property.titulo}"…`);

  try {
    const user = await requireAdmin();
    if (!user) {
      throw new Error('Debes iniciar sesión como administradora.');
    }

    const { data, error } = await supabase
      .from('propiedades')
      .delete()
      .eq('id', property.id)
      .select('id');

    if (error) throw error;

    if (!data || data.length === 0) {
      throw new Error(
        'Supabase no eliminó el registro. Comprueba los permisos ' +
        'DELETE de la tabla propiedades.'
      );
    }

    if (editingId === property.id) resetEditor();

    message('Propiedad eliminada. Comprobando fotografías…');

    const paths = Array.isArray(property.fotografias)
      ? property.fotografias.filter(p => typeof p === 'string')
      : [];

    if (paths.length) {
      const { error: storageError } = await supabase
        .storage.from(BUCKET).remove(paths);

      if (storageError) {
        message(
          'La propiedad se eliminó, pero no se pudieron eliminar ' +
          'sus fotografías de Storage: ' + storageError.message
        );
        await loadProperties();
        return;
      }
    }

    message('Propiedad y fotografías eliminadas correctamente.');
    await loadProperties();
  } catch (error) {
    message('No se pudo eliminar la propiedad: ' + error.message);
  } finally {
    busy = false;
  }
}

$('propertyForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (busy) return;

  $('saveButton').disabled = true;
  busy = true;
  const uploadedPaths = [];

  try {
    const user = await requireAdmin();

    if (!user) {
      throw new Error(
        'Debes iniciar sesión con una cuenta administradora.'
      );
    }

    const files = Array.from($('photos').files);

    if (files.length > 20) {
      throw new Error(
        'Puedes añadir un máximo de 20 fotografías por operación.'
      );
    }

    for (const file of files) {
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        throw new Error(
          'Usa únicamente imágenes JPEG, PNG o WebP.'
        );
      }

      if (file.size > 5 * 1024 * 1024) {
        throw new Error(`La imagen "${file.name}" supera los 5 MB.`);
      }
    }

    if (files.length) message('Subiendo fotografías…');

    for (const file of files) {
      const safeName = file.name
        .normalize('NFKD')
        .replace(/[^a-zA-Z0-9._-]/g, '_');

      const path =
        `${user.id}/${crypto.randomUUID()}-${safeName}`;

      const { error } = await supabase.storage
        .from(BUCKET)
        .upload(path, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type
        });

      if (error) throw error;
      uploadedPaths.push(path);
    }

    const record = {
      titulo: $('title').value.trim(),
      operacion: $('operation').value,
      tipo: $('type').value,
      comuna: $('location').value.trim(),
      precio: $('price').value.trim(),
      caracteristicas: $('details').value.trim(),
      descripcion: $('description').value.trim(),
      fotografias: [...editingPhotos, ...uploadedPaths],
      publicada: $('published').checked,
      updated_at: new Date().toISOString()
    };

    if (editingId !== null) {
      message('Guardando cambios…');

      const { data, error } = await supabase
        .from('propiedades')
        .update(record)
        .eq('id', editingId)
        .select('id');

      if (error) throw error;

      if (!data || data.length === 0) {
        throw new Error(
          'Supabase no actualizó la propiedad. Comprueba los ' +
          'permisos UPDATE de la tabla propiedades.'
        );
      }

      message('Cambios guardados correctamente.');
    } else {
      message('Guardando propiedad…');
      delete record.updated_at;

      const { error } = await supabase
        .from('propiedades')
        .insert(record);

      if (error) throw error;

      message('Propiedad guardada correctamente.');
    }

    resetEditor();
    await loadProperties();

  } catch (error) {
    message(
      'No se pudo completar la operación: ' + error.message +
      (uploadedPaths.length
        ? '\nSe subieron fotografías nuevas. Si el guardado falló, ' +
          'podrían quedar archivos en Storage.'
        : '')
    );
  } finally {
    busy = false;
    $('saveButton').disabled = false;
  }
});

supabase.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_OUT' || !session) {
    resetEditor();
    showLogin();
  }
});

const user = await requireAdmin();

if (user) {
  message('Sesión activa. Comprobando propiedades…');
  await loadProperties();
} else {
  message('Introduce tus credenciales para acceder al panel.');
}
</script>
</body>
</html>
